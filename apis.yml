aid: astra-space
name: Astra Space
description: 'Astra is a commercial space company providing dedicated small satellite
  launch services and flight-proven electric propulsion systems. Founded in 2016 and
  headquartered in Alameda, California, Astra sells two products: Launch Services on
  Rocket 4 — targeting roughly 600 kg to low Earth orbit at a weekly cadence — and the
  Astra Spacecraft Engine, a flight-proven Hall-effect electric propulsion system sold
  in single- and multi-thruster configurations for satellite constellations. Astra
  became the fastest privately funded U.S. company to reach orbit in 2021 and returned
  to private ownership in July 2024. Astra publishes no public developer API, SDK, or
  machine-readable specification; its buyer-facing surface is a set of launch-services
  and spacecraft-engine inquiry forms alongside a published Rocket 4 Payload User''s
  Guide and engine data sheet.'
